; Development overrides — not suitable for production.
; Downstream Dockerfiles apply this when APP_ENV != production.
memory_limit=512M
display_errors=On
error_reporting=E_ALL

; Disable JIT in dev — per-restart warmup overhead outweighs any gain.
; Production keeps JIT enabled via opcache.ini.
opcache.jit=disable
opcache.jit_buffer_size=0
